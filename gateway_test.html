<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K.A.R.E.N. Gateway Streaming Test</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 2rem; background: #fafafa; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 1.5rem; border: 1px solid #ddd; border-radius: 6px; }
        label { font-weight: bold; display: block; margin-bottom: 0.5rem; }
        input[type="text"] { width: 100%; padding: 0.5rem; margin-bottom: 1rem; box-sizing: border-box; }
        button { padding: 0.6rem 1.2rem; background: #0066cc; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:disabled { background: #888; }
        #log { margin-top: 1rem; white-space: pre-wrap; background: #f4f4f4; padding: 1rem; border: 1px solid #ccc; height: 350px; overflow-y: auto; font-family: monospace; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="container">
    <h2>K.A.R.E.N. Gateway Streaming Diagnostic</h2>
    <label for="endpoint">Gateway Base URL (Tailscale Serve HTTPS or localhost):</label>
    <input id="endpoint" type="text" value="http://127.0.0.1:8765" />

    <label for="token">Bearer Token:</label>
    <input id="token" type="text" placeholder="Enter gateway bearer token" />

    <button id="run">Run Streaming Test</button>
    <button id="stop" disabled>Stop Generation</button>

    <div id="log">Ready.</div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        if (window.location.origin && window.location.origin.startsWith('http')) {
            document.getElementById('endpoint').value = window.location.origin;
        }
    });

    const logEl = document.getElementById('log');
    const runBtn = document.getElementById('run');
    const stopBtn = document.getElementById('stop');
    let activeRequestId = null;
    let abortController = null;

    function log(msg) {
        logEl.textContent += msg + '\n';
        logEl.scrollTop = logEl.scrollHeight;
    }

    runBtn.addEventListener('click', async () => {
        const endpoint = document.getElementById('endpoint').value.trim();
        const token = document.getElementById('token').value.trim();
        if (!token) {
            alert('Please enter a valid bearer token.');
            return;
        }

        logEl.textContent = 'Starting test...\n';
        runBtn.disabled = true;
        stopBtn.disabled = false;
        activeRequestId = crypto.randomUUID();
        abortController = new AbortController();

        const body = {
            request_id: activeRequestId,
            conversation_id: crypto.randomUUID(),
            mode: 'fast',
            messages: [{ role: 'user', content: 'Say hello concisely.' }]
        };

        try {
            const resp = await fetch(`${endpoint}/v1/chat`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(body),
                signal: abortController.signal
            });

            if (!resp.ok) {
                log(`HTTP Error: ${resp.status} ${resp.statusText}`);
                const errJson = await resp.json().catch(() => null);
                if (errJson) log(JSON.stringify(errJson, null, 2));
                return;
            }

            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop(); // Retain remainder

                for (const line of lines) {
                    if (line.startsWith('event:')) {
                        log(`[Event] ${line.slice(6).trim()}`);
                    } else if (line.startsWith('data:')) {
                        try {
                            const data = JSON.parse(line.slice(5).trim());
                            if (data.text) {
                                log(`[Delta] ${data.text}`);
                            } else {
                                log(`[Data] ${JSON.stringify(data)}`);
                            }
                        } catch (e) {
                            log(`[Raw Data] ${line.slice(5).trim()}`);
                        }
                    }
                }
            }
            log('Stream finished successfully.');
        } catch (err) {
            if (err.name === 'AbortError') {
                log('Stream aborted locally.');
            } else {
                log(`Network/Fetch Error: ${err.message}`);
            }
        } finally {
            runBtn.disabled = false;
            stopBtn.disabled = true;
            abortController = null;
        }
    });

    stopBtn.addEventListener('click', async () => {
        if (!activeRequestId) return;
        const endpoint = document.getElementById('endpoint').value.trim();
        const token = document.getElementById('token').value.trim();

        if (abortController) {
            abortController.abort();
        }

        try {
            await fetch(`${endpoint}/v1/chat/requests/${activeRequestId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            log(`Sent cancel signal for request ${activeRequestId}`);
        } catch (e) {
            log(`Failed to send cancel: ${e.message}`);
        }
    });
</script>
</body>
</html>
